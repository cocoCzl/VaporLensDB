[package]
name = "vapor-lens-db"
version = "0.8.5"
description = "A modern cross-platform database management tool"
authors = ["VaporLensDB Team"]
edition = "2021"

[lib]
name = "vapor_lens_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep Tauri's production feature surface explicit. In particular, do not enable
# its `devtools` feature: debug builds retain developer tooling via
# `debug_assertions`, while release artifacts do not compile the DevTools API.
tauri = { version = "2", default-features = false, features = ["wry", "compression", "common-controls-v6", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
async-trait = "0.1"
futures-util = "0.3"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "chrono"] }
url = "2"
tokio-util = { version = "0.7", features = ["compat"] }
aes-gcm = "0.11"
base64 = "0.23"
log = "0.4"
env_logger = "0.11"
regex = "1"
tauri-plugin-clipboard-manager = "2.3.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Uses Security.framework directly for the existing generic-password Keychain
# item, avoiding the `security -w <secret>` command-line exposure.
security-framework = "3.7.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
