[package]
name = "vapor-lens-db"
version = "0.4.2"
description = "A modern cross-platform database management tool"
authors = ["VaporLensDB Team"]
edition = "2021"

[lib]
name = "vapor_lens_db_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
mysql_async = { version = "0.34", default-features = false, features = ["minimal"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
aes-gcm = "0.10"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
